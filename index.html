<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Клик ULTRA Mobile</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:#0a0a1a;color:#e6eaf2;overflow:hidden;user-select:none;
  -webkit-user-select:none;touch-action:manipulation}

/* LOGIN */
#login{position:fixed;inset:0;z-index:100;background:#0a0a1a;display:flex;
  align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#login.hide{display:none}
#loginBox{background:#151530;border:1px solid #4a4a8a;border-radius:16px;
  padding:22px;width:100%;max-width:360px;text-align:center;
  max-height:calc(100vh - 32px);overflow-y:auto}
#loginBox h1{font-size:20px;margin-bottom:16px;
  background:linear-gradient(135deg,#a78bfa,#f472b6,#fbbf24);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
#loginBox label{display:block;text-align:left;font-size:10px;opacity:.6;
  margin:10px 0 5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700}
#loginBox input{width:100%;padding:13px 14px;border-radius:11px;
  background:rgba(120,150,255,.08);border:1px solid #3a3a6a;
  color:#fff;font-size:16px;font-family:inherit;outline:none}
#loginBox input:focus{border-color:#a78bfa}
#loginTabs{display:flex;gap:5px;margin-bottom:12px}
#loginTabs button{flex:1;padding:11px;border-radius:10px;background:none;
  border:1px solid transparent;color:#8892b8;font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit}
#loginTabs button.active{background:rgba(167,139,250,.15);
  border-color:rgba(167,139,250,.4);color:#c4b5fd}
.btnL{width:100%;padding:14px;border-radius:11px;border:none;
  background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff;
  font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
  margin-bottom:9px}
.btnL.sec{background:rgba(120,150,255,.1);border:1px solid #3a3a6a;
  color:#c8d4ff;font-size:12px;padding:12px}
.btnL.reset{background:rgba(200,50,50,.15);border:1px solid rgba(200,50,50,.3);
  color:#ff9999;font-size:11px;padding:11px}
#loginErr{color:#f87171;font-size:11px;min-height:16px;margin-top:6px}
#savedWrap{margin-top:12px;padding-top:12px;border-top:1px solid #2a2a5a}
#savedWrap.hide{display:none}
.saved-row{display:flex;gap:5px;margin-bottom:5px}
.saved-btn{flex:1;padding:10px;border-radius:9px;background:rgba(120,150,255,.06);
  border:1px solid #3a3a6a;color:#c8d4ff;font-size:12px;cursor:pointer;
  font-family:inherit;text-align:left;display:flex;justify-content:space-between;
  font-weight:600}
.saved-btn:hover{background:rgba(167,139,250,.15)}
.del-btn{padding:10px;border-radius:9px;background:rgba(200,50,50,.15);
  border:1px solid rgba(200,50,50,.3);color:#ff9999;font-size:11px;
  cursor:pointer;font-family:inherit;font-weight:700}

/* APP - MOBILE LAYOUT */
#app{display:none;grid-template-rows:auto 1fr auto;height:100vh;
  height:100dvh;overflow:hidden}
#app.on{display:grid}

/* Header - компактный */
#head{padding:8px 12px;background:#101025;
  border-bottom:1px solid #2a2a5a;display:flex;justify-content:space-between;
  align-items:center;gap:8px;padding-top:calc(8px + env(safe-area-inset-top))}
#logo{font-size:14px;font-weight:900;
  background:linear-gradient(135deg,#a78bfa,#f472b6,#fbbf24);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;white-space:nowrap}
#topStats{display:flex;gap:8px;font-size:11px;font-weight:700;flex-wrap:wrap;
  flex:1;justify-content:flex-end}
#topStats b{color:#fbbf24}
#profBtn{padding:6px 10px;border-radius:999px;background:rgba(167,139,250,.15);
  border:1px solid rgba(167,139,250,.35);color:#c4b5fd;font-size:11px;
  font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;
  display:flex;align-items:center;gap:4px;padding:8px 12px}

/* Main - область клика */
#main{position:relative;overflow:hidden;display:flex;
  align-items:center;justify-content:center;
  background:radial-gradient(circle at center,rgba(251,191,36,.06),transparent 70%)}
#clickArea{width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;position:relative;touch-action:manipulation}
#clickBtn{width:min(72vw,320px);height:min(72vw,320px);border-radius:50%;
  border:none;cursor:pointer;position:relative;
  background:radial-gradient(circle at 35% 30%,#fef3c7,#fbbf24 30%,#b45309);
  box-shadow:0 20px 60px rgba(251,191,36,.5),
    inset 0 -15px 45px rgba(0,0,0,.4),
    inset 0 15px 45px rgba(255,255,255,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#78350f;font-weight:900;transition:transform .08s;
  touch-action:manipulation;user-select:none}
#clickBtn:active{transform:scale(.94)}
#ci{font-size:min(22vw,100px);filter:drop-shadow(0 8px 16px rgba(0,0,0,.4))}
#cv{font-size:min(6vw,24px);margin-top:2px}
#ch{font-size:11px;margin-top:4px;letter-spacing:.15em;font-weight:900}

#combo{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  z-index:5;text-align:center;opacity:0;transition:.3s;pointer-events:none}
#combo.on{opacity:1}
#combo .lbl{font-size:10px;letter-spacing:.2em;opacity:.6;font-weight:800}
#combo .val{font-size:32px;font-weight:900;
  background:linear-gradient(135deg,#fbbf24,#f472b6);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}

.fn{position:absolute;pointer-events:none;font-size:24px;font-weight:900;
  color:#fef3c7;text-shadow:0 2px 12px rgba(251,191,36,.9);
  animation:fu 1.1s ease-out forwards;z-index:10}
.fn.crit{font-size:34px;color:#fbbf24}
@keyframes fu{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}
  20%{transform:translate(-50%,-70%) scale(1.2);opacity:1}
  100%{transform:translate(-50%,-200%) scale(1);opacity:0}}
.pt{position:absolute;pointer-events:none;border-radius:50%;
  animation:pt 1s ease-out forwards;z-index:9}
@keyframes pt{0%{transform:translate(0,0) scale(1);opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}

.golden{position:absolute;width:68px;height:68px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#fef3c7,#fbbf24,#b45309);
  box-shadow:0 0 40px #fbbf24;cursor:pointer;z-index:8;
  display:flex;align-items:center;justify-content:center;font-size:30px;
  animation:gF 2s ease-in-out infinite;touch-action:manipulation}
@keyframes gF{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* Content area - переключение вкладок */
#content{display:none;overflow-y:auto;padding:12px;
  background:#101025;border-top:1px solid #2a2a5a}
#content.on{display:block}
#content::-webkit-scrollbar{width:4px}
#content::-webkit-scrollbar-thumb{background:rgba(167,139,250,.3);border-radius:2px}

/* Tabs content shared */
.stitle{font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:#8892b8;margin:12px 0 7px;font-weight:800}
.stitle:first-child{margin-top:0}
.card{display:flex;align-items:center;gap:10px;padding:12px;
  margin-bottom:7px;border-radius:11px;background:rgba(120,150,255,.06);
  border:1px solid rgba(120,150,255,.12);cursor:pointer;
  transition:.15s;position:relative;touch-action:manipulation}
.card:active:not(.off){background:rgba(167,139,250,.2)}
.card.off{opacity:.4;cursor:not-allowed}
.card.on{border-color:rgba(120,255,140,.5);
  background:rgba(120,255,140,.1)}
.card .ic{font-size:26px;width:38px;text-align:center;flex-shrink:0}
.card .in{flex:1;min-width:0}
.card .nm{font-size:13px;font-weight:800;margin-bottom:2px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .ds{font-size:11px;opacity:.6;line-height:1.3}
.card .cs{font-size:12px;font-weight:900;color:#fbbf24;
  background:rgba(251,191,36,.15);padding:4px 10px;border-radius:7px;
  white-space:nowrap;flex-shrink:0}
.card .lv{position:absolute;top:6px;right:6px;font-size:10px;
  color:#c4b5fd;font-weight:900;background:rgba(167,139,250,.25);
  padding:2px 7px;border-radius:5px}
.bonus{font-size:10px;background:rgba(251,191,36,.3);color:#fbbf24;
  padding:2px 6px;border-radius:4px;font-weight:900}

.sk{width:38px;height:38px;border-radius:50%;flex-shrink:0;
  border:2px solid rgba(255,255,255,.2);
  background:radial-gradient(circle at 30% 30%,#6a8fff,#1a2a6a)}
.sk.fire{background:radial-gradient(circle at 30% 30%,#ffaa44,#881100)}
.sk.gold{background:radial-gradient(circle at 30% 30%,#ffff88,#885500)}
.sk.rainbow{background:linear-gradient(45deg,#f00,#f80,#fe0,#0c4,#04f,#80f,#f00);
  background-size:400% 400%;animation:rb 3s linear infinite}
@keyframes rb{0%{background-position:0% 50%}100%{background-position:400% 50%}}
.sk.cosmic{background:radial-gradient(circle at 30% 30%,#fff,#88aaff,#000)}

.pr{display:flex;gap:6px;margin-bottom:10px}
.pr input{flex:1;padding:12px;border-radius:9px;
  background:rgba(120,150,255,.08);border:1px solid #3a3a6a;
  color:#fff;font-size:14px;font-family:inherit;outline:none}
.pr input:focus{border-color:#a78bfa}
.pr button{padding:12px 18px;border-radius:9px;
  background:rgba(120,255,140,.2);border:1px solid rgba(120,255,140,.35);
  color:#aaffcc;font-size:13px;font-weight:800;cursor:pointer;
  font-family:inherit}

.myc{padding:12px;border-radius:10px;background:rgba(120,255,140,.08);
  border:1px solid rgba(120,255,140,.3);font-family:monospace;font-size:10px;
  word-break:break-all;color:#7aff9c;line-height:1.4;max-height:80px;
  overflow-y:auto;margin-bottom:10px}
.abtn{width:100%;padding:14px;border-radius:10px;border:none;
  background:linear-gradient(135deg,rgba(120,255,140,.25),rgba(100,200,255,.2));
  border:1px solid rgba(120,255,140,.35);color:#aaffcc;font-size:13px;
  font-weight:800;cursor:pointer;font-family:inherit;
  margin-bottom:10px;touch-action:manipulation}
.abtn:active{opacity:.7}
.abtn.purple{background:rgba(167,139,250,.2);
  border-color:rgba(167,139,250,.4);color:#c4b5fd}
.abtn.gold{background:rgba(251,191,36,.2);
  border-color:rgba(251,191,36,.4);color:#fbbf24}

.fin{width:100%;padding:12px;border-radius:10px;
  background:rgba(120,150,255,.08);border:1px solid #3a3a6a;
  color:#fff;font-size:12px;font-family:monospace;outline:none;
  margin-bottom:10px;resize:none;min-height:60px}
.fin:focus{border-color:#a78bfa}

.frd{display:flex;align-items:center;gap:10px;padding:12px;
  margin-bottom:7px;border-radius:11px;
  background:rgba(120,150,255,.08);
  border:1px solid rgba(150,180,255,.15);cursor:pointer;transition:.15s;
  touch-action:manipulation}
.frd:active{background:rgba(167,139,250,.2)}
.frd .av{width:38px;height:38px;border-radius:50%;
  background:linear-gradient(135deg,#a78bfa,#f472b6);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:#fff;font-size:16px;flex-shrink:0}
.frd .fi{flex:1;min-width:0}
.frd .nm{font-size:13px;font-weight:800;margin-bottom:2px}
.frd .st{font-size:11px;opacity:.7}
.frd .dl{padding:7px 10px;border-radius:6px;background:rgba(255,80,80,.15);
  border:1px solid rgba(255,80,80,.3);color:#ff9999;font-size:11px;
  cursor:pointer;font-family:inherit;font-weight:700;
  touch-action:manipulation}

.lb2{display:flex;align-items:center;gap:10px;padding:12px;
  margin-bottom:7px;border-radius:11px;
  background:rgba(120,150,255,.06);
  border:1px solid rgba(150,180,255,.12);font-size:13px}
.lb2.you{background:linear-gradient(90deg,rgba(251,191,36,.15),transparent);
  border:1px solid rgba(251,191,36,.4)}
.lb2 .rk{width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:12px;background:rgba(120,150,255,.15)}
.lb2:nth-child(1) .rk{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000}
.lb2:nth-child(2) .rk{background:linear-gradient(135deg,#c0c0c0,#808080);color:#000}
.lb2:nth-child(3) .rk{background:linear-gradient(135deg,#cd7f32,#8b4513);color:#fff}
.lb2 .inf{flex:1;min-width:0}
.lb2 .nm{font-weight:800;font-size:13px}
.lb2 .mt{font-size:11px;opacity:.6;margin-top:1px}
.lb2 .v{font-weight:900;color:#fbbf24;font-size:13px}

.empty{padding:30px 16px;text-align:center;opacity:.5;font-size:12px;line-height:1.6}

.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sbox{padding:12px;border-radius:11px;text-align:center;
  background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25)}
.sbox .sl{font-size:10px;letter-spacing:.1em;opacity:.7;
  text-transform:uppercase;font-weight:800;margin-bottom:3px}
.sbox .sv{font-size:18px;font-weight:900;color:#fbbf24}

.pc{padding:16px;border-radius:12px;text-align:center;
  background:linear-gradient(135deg,rgba(244,114,182,.15),rgba(167,139,250,.1));
  border:2px solid rgba(244,114,182,.4);margin-bottom:12px}
.pc h3{font-size:15px;margin-bottom:6px;
  background:linear-gradient(135deg,#f472b6,#a78bfa);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent}
.pc p{font-size:12px;opacity:.75;margin-bottom:10px;line-height:1.4}

.tog{display:flex;align-items:center;justify-content:space-between;
  padding:14px;border-radius:10px;background:rgba(120,150,255,.05);
  border:1px solid rgba(150,180,255,.12);margin-bottom:8px;font-size:13px;
  font-weight:600}
.tbtn{width:44px;height:26px;border-radius:13px;
  background:rgba(100,100,150,.5);position:relative;
  cursor:pointer;transition:.2s;border:none;flex-shrink:0;
  touch-action:manipulation}
.tbtn.on{background:rgba(120,255,140,.6)}
.tbtn::after{content:'';position:absolute;width:18px;height:18px;
  border-radius:50%;background:#fff;top:4px;left:4px;transition:.2s}
.tbtn.on::after{left:22px}

.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
  gap:6px;margin-bottom:12px}
.ac{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:4px;
  background:rgba(120,150,255,.05);border:1px solid rgba(150,180,255,.12);
  opacity:.3;transition:.2s;font-size:8px}
.ac.on{opacity:1;background:rgba(251,191,36,.15);
  border-color:rgba(251,191,36,.4)}
.ac .ai{font-size:22px;margin-bottom:2px}

/* BOTTOM NAV */
#nav{display:grid;grid-template-columns:repeat(6,1fr);gap:0;
  background:#101025;border-top:1px solid #2a2a5a;
  padding-bottom:env(safe-area-inset-bottom)}
.navBtn{padding:10px 4px;background:none;border:none;color:#8892b8;
  font-size:22px;cursor:pointer;font-family:inherit;
  transition:.15s;position:relative;touch-action:manipulation;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.navBtn.active{color:#c4b5fd;background:rgba(167,139,250,.1)}
.navBtn .lbl{font-size:9px;font-weight:700;letter-spacing:.05em}
.navBtn.active::after{content:'';position:absolute;top:0;left:20%;right:20%;
  height:2px;background:#a78bfa;border-radius:0 0 2px 2px}

/* Modal - полноэкранный для мобилки */
.modal{position:fixed;inset:0;z-index:200;display:none;
  align-items:flex-end;background:rgba(0,0,0,.85)}
.modal.on{display:flex}
.mc{background:#151530;border-top:1px solid #4a4a8a;
  border-radius:16px 16px 0 0;padding:20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;width:100%;
  position:relative;animation:slideUp .25s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mc h2{font-size:17px;margin-bottom:14px;color:#fbbf24;
  display:flex;justify-content:space-between;align-items:center}
.mc label{display:block;font-size:11px;opacity:.6;
  text-transform:uppercase;letter-spacing:.1em;
  margin:10px 0 5px;font-weight:700}
.mc input,.mc textarea{width:100%;padding:13px;border-radius:10px;
  background:rgba(120,150,255,.08);border:1px solid #3a3a6a;
  color:#fff;font-size:14px;font-family:inherit;outline:none}
.mc input:focus,.mc textarea:focus{border-color:#a78bfa}
.mc textarea{resize:vertical;min-height:80px;
  font-family:monospace;font-size:11px}
.xb{background:none;border:none;color:#ff9999;font-size:26px;
  cursor:pointer;font-weight:900;line-height:1;padding:0 8px;
  touch-action:manipulation}

.pcard{padding:14px;border-radius:11px;text-align:center;
  background:rgba(167,139,250,.1);
  border:1px solid rgba(167,139,250,.3);margin-bottom:12px}
.pav{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;
  background:linear-gradient(135deg,#a78bfa,#f472b6);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#fff}
.pnm{font-size:17px;font-weight:900;margin-bottom:3px}
.prl{font-size:11px;opacity:.6;letter-spacing:.15em;margin-bottom:8px}
.ps{padding:7px;border-radius:7px;background:rgba(0,0,0,.2);
  font-size:12px;font-weight:700;display:flex;
  justify-content:space-between;margin-bottom:4px}
.ps b{color:#fbbf24}

.mgh{font-size:17px;font-weight:900;text-align:center;
  margin-bottom:10px;color:#fbbf24}
.mgd{font-size:12px;opacity:.7;text-align:center;
  margin-bottom:14px;line-height:1.4}
.mgi{font-size:13px;text-align:center;margin-bottom:12px;
  color:#fbbf24;font-weight:800}
.mgin{width:100%;padding:15px;border-radius:10px;text-align:center;
  font-size:22px;font-weight:900;background:rgba(120,150,255,.1);
  border:2px solid rgba(167,139,250,.3);color:#c4b5fd;
  font-family:monospace;outline:none;margin-bottom:10px}
.mgin:focus{border-color:#a78bfa}
.mgg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  margin-bottom:12px}
.mgcell{aspect-ratio:1;border-radius:9px;
  background:rgba(120,255,140,.15);
  border:2px solid rgba(120,255,140,.3);font-size:26px;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;
  justify-content:center;transition:.15s;touch-action:manipulation}
.mgcell:active:not(:disabled){background:rgba(120,255,140,.35);
  transform:scale(1.05)}
.mgcell:disabled{cursor:default;opacity:.7}

.msg{padding:8px 10px;margin-bottom:6px;border-radius:8px;
  background:rgba(120,150,255,.08);font-size:12px;line-height:1.4}
.msg.own{background:rgba(167,139,250,.15);text-align:right}
.msg .ma{font-size:10px;font-weight:800;color:#c4b5fd;margin-bottom:3px}
.msg .mt{font-size:9px;opacity:.5;margin-left:6px;font-weight:400}

#toast{position:fixed;top:calc(60px + env(safe-area-inset-top));
  left:50%;transform:translateX(-50%) translateY(-150px);
  padding:13px 22px;border-radius:11px;
  background:rgba(120,255,140,.98);color:#052e1a;font-weight:800;
  font-size:13px;box-shadow:0 10px 40px rgba(120,255,140,.5);
  transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  z-index:400;pointer-events:none;max-width:calc(100vw - 32px);
  text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:rgba(255,80,80,.98);color:#fff}
#toast.ach{background:linear-gradient(135deg,#fbbf24,#f472b6);color:#4a1a2e}

/* Landscape - для игры лёжа */
@media (orientation:landscape) and (max-height:500px){
  #clickBtn{width:min(50vh,280px);height:min(50vh,280px)}
  #ci{font-size:min(15vh,80px)}
  #content{max-height:60vh}
  #nav{grid-template-columns:repeat(6,1fr)}
  .navBtn{padding:6px 2px;font-size:18px}
  .navBtn .lbl{font-size:8px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div id="loginBox">
    <h1>💎 КЛИК ULTRA</h1>
    <div id="loginTabs">

function hp(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)+s.charCodeAt(i)|0;return Math.abs(h).toString(36);}
function fmt(n){n=Math.floor(n);
  if(n>=1e15)return(n/1e15).toFixed(2)+'Q';
  if(n>=1e12)return(n/1e12).toFixed(2)+'T';
  if(n>=1e9)return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return n.toString();}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}

    usedPromos:[],promoCps:0,achievements:{},prestigeLevel:0,

    comboMult:1.0,messages:[],soundOn:true,animationsOn:true};
}

// ============ COMPUTE ============
function recalc(){
  let p=1,a=0,cc=0.1,cp=5,cm=1.0;
  for(const u of UPGRADES){
    const n=S.upgrades[u.id]||0;
    if(n>0&&u.ef){
      if(u.ef.power)p+=u.ef.power*n;
      if(u.ef.auto)a+=u.ef.auto*n;
      if(u.ef.critc)cc+=u.ef.critc*n;
      if(u.ef.critp)cp+=u.ef.critp*n;
      if(u.ef.combom)cm+=u.ef.combom*n;
    }
  }
  let m=1;
  for(const u of UPGRADES){
    if(u.ef&&u.ef.mult){
      const n=S.upgrades[u.id]||0;
      m*=Math.pow(u.ef.mult,n);
    }
  }
  const sk=SKINS.find(x=>x.id===S.activeSkin)||SKINS[0];
  const pm=1+S.prestigeLevel*0.5;
  S.power=p*m*sk.b*pm;
  S.auto=a*m*sk.b*pm+(S.promoCps||0);
  S.critChance=Math.min(0.75,cc);
  S.critPower=cp;
  S.comboMult=cm;
}
function ucost(u){return Math.floor(u.bc*Math.pow(u.g,S.upgrades[u.id]||0));}

// ============ AUDIO ============
let actx=null;
function ia(){
  if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function bp(f,d,t,v){
  if(!S.soundOn)return;ia();if(!actx)return;
  try{const o=actx.createOscillator(),g=actx.createGain();
    o.type=t||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(v||0.05,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+d);
    o.connect(g).connect(actx.destination);
    o.start();o.stop(actx.currentTime+d);
  }catch(e){}
}
const SFX={
  boing(c,n){
    const o=c.createOscillator();o.type='square';const f=400+Math.random()*300;
    o.frequency.setValueAtTime(f,n);
    o.frequency.exponentialRampToValueAtTime(f*1.6,n+0.05);
    o.frequency.exponentialRampToValueAtTime(f*0.7,n+0.15);
    const g=c.createGain();g.gain.setValueAtTime(0.13,n);
    g.gain.exponentialRampToValueAtTime(0.001,n+0.18);
    o.connect(g).connect(c.destination);o.start(n);o.stop(n+0.18);
  },
  coin(c,n){
    [988,1319].forEach((f,i)=>{
      const o=c.createOscillator();o.type='square';o.frequency.value=f;
      const g=c.createGain();g.gain.setValueAtTime(0,n+i*0.06);
      g.gain.linearRampToValueAtTime(0.1,n+i*0.06+0.005);
      g.gain.exponentialRampToValueAtTime(0.001,n+i*0.06+0.16);
      o.connect(g).connect(c.destination);
      o.start(n+i*0.06);o.stop(n+i*0.06+0.17);
    });
  },
  laser(c,n){
    const o=c.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(2200,n);
    o.frequency.exponentialRampToValueAtTime(180,n+0.14);
    const g=c.createGain();g.gain.setValueAtTime(0.09,n);
    g.gain.exponentialRampToValueAtTime(0.001,n+0.16);
    o.connect(g).connect(c.destination);o.start(n);o.stop(n+0.16);
  },
  bell(c,n){
    [880,1108,1320].forEach((f,i)=>{
      const o=c.createOscillator();o.type='sine';o.frequency.value=f;
      const g=c.createGain();g.gain.setValueAtTime(0,n+i*0.03);
      g.gain.linearRampToValueAtTime(0.12,n+i*0.03+0.01);
      g.gain.exponentialRampToValueAtTime(0.001,n+i*0.03+0.4);
      o.connect(g).connect(c.destination);
      o.start(n+i*0.03);o.stop(n+i*0.03+0.4);
    });
  },
  zap(c,n){
    const o=c.createOscillator();o.type='sawtooth';
    o.frequency.setValueAtTime(400,n);
    o.frequency.exponentialRampToValueAtTime(3000,n+0.08);
    o.frequency.exponentialRampToValueAtTime(200,n+0.18);
    const g=c.createGain();g.gain.setValueAtTime(0.12,n);
    g.gain.exponentialRampToValueAtTime(0.001,n+0.2);
    o.connect(g).connect(c.destination);o.start(n);o.stop(n+0.2);
  }
};
function ps(id){

  isAdmin=!!(a[name]&&a[name].isAdmin);
  S=Object.assign(defState(),a[name].state||{});
  if(!S.upgrades||typeof S.upgrades!=='object')S.upgrades={};
  if(!S.usedPromos)S.usedPromos=[];
  if(!S.achievements)S.achievements={};
  if(!S.ownedSkins||!S.ownedSkins.length)S.ownedSkins=['default'];
  if(!S.ownedSounds||!S.ownedSounds.length)S.ownedSounds=['boing'];
  if(!S.messages)S.messages=[];
  if(S.soundOn===undefined)S.soundOn=true;
  if(S.animationsOn===undefined)S.animationsOn=true;
  if(!a[name].friends)a[name].friends={};
  saveAccs(a);
  recalc();
  // Офлайн-доход
  const offSec=Math.min((ts()-(S.lastSeen||ts()))/1000,3600);
  if(offSec>60&&S.auto>0){
    const gain=S.auto*offSec*0.5;
    S.balance+=gain;S.clicks+=gain;
    setTimeout(()=>toast('💤 Офлайн: +'+fmt(gain),'ach'),700);
  }
  $('login').classList.add('hide');
  $('app').classList.add('on');
  $('topName').textContent=name;
  applySkin();
  renderTab('upgrades');
  renderTab('skins');
  renderTab('sounds');
  renderTab('ach');
  renderTab('prestige');
  renderTab('promo');
  renderTab('friends');
  renderTab('games');
  renderTab('settings');
  updateUI();
  spawnGolden();
  checkAch();
  saveState();
}

// ============ CLICK ============
const clickBtn=$('clickBtn');
const clickArea=$('clickArea');

function doClick(e){
  if(!curUser)return;
  if(raceState&&raceState.active){
    raceState.clicks++;
    const el=$('raceCounter');
    if(el)el.textContent=raceState.clicks;
    ps(S.activeSound);
    return;
  }
  const t=ts();
  if(t-lastClick<400)combo++;else combo=1;
  lastClick=t;
  const cb=1+Math.min(combo,50)*0.02*S.comboMult;
  clearTimeout(comboT);
  comboT=setTimeout(()=>{combo=0;$('combo').classList.remove('on');},800);
  if(combo>=3){
    $('combo').classList.add('on');
    $('comboVal').textContent='×'+cb.toFixed(2);
  }
  let gain=S.power*cb;
  let crit=false;
  if(Math.random()<S.critChance){
    gain*=S.critPower;crit=true;S.critCount++;
  }
  S.clicks+=gain;S.balance+=gain;
  const rect=clickArea.getBoundingClientRect();
  let cx,cy;
  if(e&&e.clientX!==undefined){
    cx=e.clientX-rect.left;
    cy=e.clientY-rect.top;
  }else{
    cx=rect.width/2;
    cy=rect.height/2;
  }
  const fn=document.createElement('div');
  fn.className='fn'+(crit?' crit':'');
  fn.textContent=(crit?'⚡+':'+')+fmt(gain);
  fn.style.left=cx+'px';fn.style.top=cy+'px';
  clickArea.appendChild(fn);
  setTimeout(()=>fn.remove(),1200);
  if(S.animationsOn){
    const colors=crit?['#fbbf24','#f59e0b']:['#fef3c7','#fbbf24'];
    const cnt=crit?10:5;
    for(let i=0;i<cnt;i++){
      const p=document.createElement('div');
      p.className='pt';
      const ang=Math.random()*Math.PI*2;
      const d=40+Math.random()*80;
      const sz=5+Math.random()*6;
      p.style.setProperty('--dx',Math.cos(ang)*d+'px');
      p.style.setProperty('--dy',Math.sin(ang)*d+'px');
      p.style.left=cx+'px';p.style.top=cy+'px';
      p.style.width=sz+'px';p.style.height=sz+'px';
      const c=colors[Math.floor(Math.random()*colors.length)];
      p.style.background=c;p.style.boxShadow='0 0 12px '+c;
      clickArea.appendChild(p);
      setTimeout(()=>p.remove(),1100);
    }
  }
  ps(S.activeSound);
  updateUI();
}
clickBtn.addEventListener('click',doClick);
clickBtn.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.touches[0];
  doClick({clientX:t.clientX,clientY:t.clientY});
},{passive:false});

function spawnGolden(){

    g.className='golden';g.textContent='💎';
    g.style.left=(Math.random()*(rect.width-80))+'px';
    g.style.top=(Math.random()*(rect.height-80))+'px';

      S.balance+=bonus;S.clicks+=bonus;
      S.goldenCount=(S.goldenCount||0)+1;
      const fx=e.clientX-rect.left,fy=e.clientY-rect.top;
      const fn=document.createElement('div');
      fn.className='fn crit';fn.textContent='💎+'+fmt(bonus);
      fn.style.left=fx+'px';fn.style.top=fy+'px';

  let h='';
  for(const[cat,title]of Object.entries(cats)){

    for(const u of items){
      const n=S.upgrades[u.id]||0;

      ch+=`<div class="card ${can?'':'off'}" data-upg="${u.id}">

// ============ FRIENDS ============
function makeFCode(){
  const a=getAccs();
  const acc=a[curUser];
  if(!acc)return '';
  return 'CBF2|'+b64e({
    i:acc.id,n:curUser,
    c:Math.floor(S.clicks),
    b:Math.floor(S.balance),
    p:S.prestigeLevel||0,
    ac:Object.keys(S.achievements||{}).length,
    t:ts()
  });
}
function parseFCode(str){
  if(!str||!str.startsWith('CBF2|'))return null;
  const d=b64d(str.slice(5));
  if(!d||!d.i||!d.n)return null;
  return {
    id:String(d.i),
    name:String(d.n).slice(0,20),
    clicks:Math.max(0,Math.floor(d.c)||0),
    balance:Math.max(0,Math.floor(d.b)||0),
    prestige:Math.max(0,Math.floor(d.p)||0),
    ach:Math.max(0,Math.floor(d.ac)||0),
    ts:d.t||ts()
  };
}
function renderFriends(){
  const a=getAccs();

  const friends=me.friends||{};

      <div class="mgh">⚔️ Гонка кликов</div>

      <button class="abtn" id="gBtn">НАЧАТЬ</button>
      <div id="gResult"></div>
    `;
    $('gameModal').classList.add('on');

  }

function playGuess(){
  if(!curGame||curGame.type!=='guess'||!curGame.active)return;
  const v=parseInt($('gInput').value,10);
  if(!v||v<1||v>100){toast('Введи 1-100',true);return;}
  curGame.tries++;
  const g=curGame;
  if(v===g.target){
    S.balance+=g.prize;S.clicks+=g.prize;
    S.gamesPlayed++;S.gamesWon++;
    saveState();updateUI();sAch();
    $('gResult').innerHTML=`<div class="mgi" style="color:#7aff9c">🎉 УГАДАЛ! +${fmt(g.prize)}</div>`;
    $('gBtn').style.display='none';$('gInput').style.display='none';
    g.active=false;
    setTimeout(()=>{$('gameModal').classList.remove('on');curGame=null;},2000);
    checkAch();return;
  }
  const msg=v<g.target?'📈 Больше':'📉 Меньше';
  $('gInfo').textContent=`Попыток: ${g.tries}/${g.max} · ${msg}`;
  $('gInput').value='';
  if(g.tries>=g.max){
    S.gamesPlayed++;saveState();
    $('gResult').innerHTML=`<div class="mgi" style="color:#ff9999">😢 Не угадал. Было ${g.target}</div>`;
    $('gBtn').style.display='none';$('gInput').style.display='none';
    g.active=false;
    setTimeout(()=>{$('gameModal').classList.remove('on');curGame=null;},2500);
  }
}

function startTreasure(){
  curGame={type:'treasure',winning:Math.floor(Math.random()*16),active:true};
  openGameModal();
}

function playTreasure(idx){
  if(!curGame||curGame.type!=='treasure'||!curGame.active)return;
  const g=curGame;
  const won=idx===g.winning;
  document.querySelectorAll('[data-cell]').forEach((c,i)=>{
    c.disabled=true;
    if(i===g.winning)c.textContent='💎';
    else if(i===idx)c.textContent='❌';
  });
  if(won){
    S.balance+=10000;S.clicks+=10000;
    S.gamesPlayed++;S.gamesWon++;
    saveState();updateUI();sAch();
    $('tResult').innerHTML=`<div class="mgi" style="color:#7aff9c">🎉 НАШЁЛ! +10000$</div>`;
  }else{
    S.gamesPlayed++;saveState();
    $('tResult').innerHTML=`<div class="mgi" style="color:#ff9999">😢 Мимо</div>`;
  }
  g.active=false;
  setTimeout(()=>{$('gameModal').classList.remove('on');curGame=null;},2000);
  checkAch();
}

function startRaceChallenge(){
  curGame={type:'race',active:true};
  openGameModal();
}

function beginRace(){
  raceState={active:true,clicks:0,duration:10,startTime:ts()};
  $('gameBox').innerHTML=`
    <div class="mgh">⚔️ Гонка!</div>
    <div class="mgi">Кликов: <span id="raceCounter">0</span> · Осталось: <span id="raceTimer">10</span>с</div>
    <div class="mgd">Кликай главную кнопку!</div>
  `;
  const t=setInterval(()=>{
    if(!raceState){clearInterval(t);return;}
    const left=Math.max(0,raceState.duration-(ts()-raceState.startTime)/1000);
    const el=$('raceTimer');
    if(el)el.textContent=Math.ceil(left);
    if(left<=0){clearInterval(t);endRace();}
  },100);
}

function endRace(){
  if(!raceState)return;
  const clicks=raceState.clicks;
  raceState.active=false;
  S.gamesPlayed++;
  const reward=clicks*100;
  S.balance+=reward;S.clicks+=reward;
  saveState();updateUI();sAch();
  const code='RACE2|'+b64e({f:curUser,fi:getAccs()[curUser].id,s:clicks,t:ts()});
  $('gameBox').innerHTML=`
    <div class="mgh">⚔️ Результат</div>
    <div class="mgi">${clicks} кликов · +${fmt(reward)}$</div>
    <div class="mgd">Отправь код другу:</div>
    <textarea class="fin" id="raceCode" readonly style="font-size:9px">${code}</textarea>
    <button class="abtn" id="copyRaceBtn">📋 Скопировать</button>
  `;
  $('copyRaceBtn').onclick=()=>{
    if(navigator.clipboard){
      navigator.clipboard.writeText(code).then(()=>toast('📋 Скопировано'))
        .catch(()=>prompt('Скопируй:',code));
    }else prompt('Скопируй:',code);
  };
  raceState=null;curGame=null;
  checkAch();
}

function playRaceFromCode(d){
  curGame={type:'race',active:true};
  raceState={active:true,clicks:0,duration:10,startTime:ts(),
    opponentScore:d.s,opponentName:d.f};
  $('gameBox').innerHTML=`
    <div class="mgh">⚔️ Гонка с ${esc(d.f)}</div>
    <div class="mgd">Он набрал ${d.s} кликов. Побей за 10 сек!</div>
    <div class="mgi">Твои: <span id="raceCounter">0</span> · <span id="raceTimer">10</span>с</div>
  `;
  $('gameModal').classList.add('on');
  const t=setInterval(()=>{
    if(!raceState){clearInterval(t);return;}
    const left=Math.max(0,raceState.duration-(ts()-raceState.startTime)/1000);
    const el=$('raceTimer');
    if(el)el.textContent=Math.ceil(left);
    if(left<=0){clearInterval(t);endRaceVs();}
  },100);
}

function endRaceVs(){
  if(!raceState)return;
  const clicks=raceState.clicks;
  const opp=raceState.opponentScore;
  const oppName=raceState.opponentName;
  raceState.active=false;
  S.gamesPlayed++;
  let msg='',reward=0;
  if(clicks>opp){msg=`🏆 ПОБЕДА! ${clicks} vs ${opp}`;reward=50000;S.gamesWon++;sAch();}
  else if(clicks===opp){msg=`🤝 Ничья ${clicks} vs ${opp}`;reward=10000;}
  else{msg=`😢 ${clicks} vs ${opp}`;reward=5000;}
  S.balance+=reward;S.clicks+=reward;
  saveState();updateUI();
  $('gameBox').innerHTML=`
    <div class="mgh">⚔️ Итог</div>
    <div class="mgi">${msg}</div>
    <div class="mgi" style="color:#7aff9c">+${fmt(reward)}$</div>
  `;
  raceState=null;curGame=null;
  setTimeout(()=>{$('gameModal').classList.remove('on');},3000);
  checkAch();
}

    const am=$('admAmt').value;
    if(!nm){toast('Имя',true);return;}
    handleAdm('add',nm,am);
  };
}

function handleAdm(act,name,amt){
  if(!isAdmin)return;
  const a=getAccs();
  if(act==='add'){
    if(!a[name]){
      a[name]={id:gid(),pass:hp('123'),state:defState(),
        friends:{},created:ts()};
      saveAccs(a);
    }
    if(!a[name].state)a[name].state=defState();
    const n=parseInt(amt,10)||0;
    a[name].state.clicks=(a[name].state.clicks||0)+n;
    a[name].state.balance=(a[name].state.balance||0)+n;
    saveAccs(a);
    if(name===curUser){
      S.clicks=a[name].state.clicks;
      S.balance=a[name].state.balance;
      updateUI();
    }
    toast('✅ +'+fmt(n)+' → '+name);
    renderAdmin();return;
  }
  if(!a[name]){toast('Не найден',true);return;}
  if(act==='toggleAdmin'){
    if(name===curUser){toast('Себя нельзя',true);return;}
    a[name].isAdmin=!a[name].isAdmin;
    saveAccs(a);
    toast(a[name].isAdmin?'👑 '+name+' админ':name+' не админ');
    renderAdmin();return;
  }
  if(act==='ban'){
    a[name].banned=!a[name].banned;
    if(a[name].banned)dropSess(name);
    saveAccs(a);
    toast(a[name].banned?'🚫 Забанен':'✅ Разбанен');
    renderAdmin();return;
  }
  if(act==='del'){
    if(name===curUser){toast('Себя нельзя',true);return;}
    if(!confirm('Удалить "'+name+'"?'))return;
    delete a[name];dropSess(name);saveAccs(a);
    toast('🗑️ Удалён');renderAdmin();
  }
}

// ============ PROFILE ============
$('profBtn').onclick=()=>{
  if(!curUser)return;
  $('profileBox').innerHTML=`
    <div class="pcard">
      <div class="pav">${esc(curUser[0]).toUpperCase()}</div>
      <div class="pnm">${esc(curUser)}</div>
      <div class="prl">${isAdmin?'👑 АДМИН':(S.prestigeLevel>0?'🌌 ПРЕСТИЖ '+S.prestigeLevel:'ИГРОК')}</div>
      <div class="ps"><span>Кликов</span><b>${fmt(S.clicks)}</b></div>
      <div class="ps"><span>Баланс</span><b>${fmt(S.balance)}</b></div>
      <div class="ps"><span>Престиж</span><b>${S.prestigeLevel}</b></div>
      <div class="ps"><span>Достижений</span><b>${Object.keys(S.achievements||{}).length}</b></div>
      <div class="ps"><span>Друзей</span><b>${Object.keys(getAccs()[curUser]?.friends||{}).length}</b></div>
    </div>
  `;
  $('newNameInput').value=curUser;
  $('profileModal').classList.add('on');
};

$('saveNameBtn').onclick=()=>{
  const n=$('newNameInput').value.trim().slice(0,20);
  if(!n||n===curUser){closeAllModals();return;}
  const a=getAccs();
  if(a[n]){toast('Имя занято',true);return;}
  const old=a[curUser];
  delete a[curUser];
  a[n]=old;
  saveAccs(a);
  dropSess(curUser);makeSess(n);setCur(n);
  curUser=n;
  $('topName').textContent=n;
  closeAllModals();
  toast('Имя изменено');
  saveState();
};

$('logoutBtn').onclick=()=>{closeAllModals();logout();};

// ============ MODAL CLOSE ============
document.querySelectorAll('[data-close]').forEach(b=>{
  b.onclick=()=>{
    const id=b.dataset.close;
    $(id).classList.remove('on');
    if(id==='gameModal'&&curGame){curGame=null;raceState=null;}
  };
});
function closeAllModals(){
  document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'));
  curGame=null;raceState=null;
}
document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('click',e=>{
    if(e.target===m){
      m.classList.remove('on');
      if(m.id==='gameModal'&&curGame){curGame=null;raceState=null;}
    }
  });
});

// ============ AUTO LOGIN & INCOME ============
ensureAdmin();
renderSaved();

(function(){
  const last=getCur();
  if(last&&hasSess(last)){
    const a=getAccs();
    if(a[last]&&!a[last].banned)enterGame(last);
  }
})();

let lastTick=performance.now();
function loop(now){
  const dt=Math.min(now-lastTick,100)/1000;
  lastTick=now;
  if(curUser&&S.auto>0){
    const gain=S.auto*dt;
    S.clicks+=gain;S.balance+=gain;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

setInterval(()=>{
  if(curUser){
    $('sBal').textContent=fmt(S.balance);
    $('sClk').textContent=fmt(S.clicks);
  }
},500);
setInterval(()=>{if(curUser)saveState();},5000);
setInterval(()=>{if(curUser)checkAch();},2000);
window.addEventListener('beforeunload',()=>{if(curUser)saveState();});
// Отключаем контекстное меню на клик-кнопке для мобилки
clickBtn.addEventListener('contextmenu',e=>e.preventDefault());

})();
</script>
